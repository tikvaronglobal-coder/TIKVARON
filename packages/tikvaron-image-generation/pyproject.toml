[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tikvaron-image-generation"
version = "0.1.0"
description = "Reusable TIKVARON image generation and editing component powered by OpenAI GPT Image."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=2.0.0,<3.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[project.scripts]
tikvaron-image = "tikvaron_image_generation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
