name: TIKVARON Dental Receptionist CI

on:
  pull_request:
    paths:
      - "apps/dental-receptionist/**"
      - ".github/workflows/dental-receptionist-ci.yml"
  push:
    branches:
      - main
      - feat/dental-receptionist-staging
    paths:
      - "apps/dental-receptionist/**"
      - ".github/workflows/dental-receptionist-ci.yml"

permissions:
  contents: read

concurrency:
  group: dental-receptionist-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/dental-receptionist
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run required test (TypeScript validation)
        run: npm test
      - name: Build Next.js application
        run: npm run build
