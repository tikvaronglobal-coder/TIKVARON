name: TIKVARON Engineering Intelligence — CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TIKVARON_RELEASE_DIR: .tikvaron-release/tikvaron-engineering-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore and integrity-check pinned v0.2.0 source release
        run: |
          mkdir -p .release-cache .tikvaron-release && cat releases/.archive-data/tikvaron-engineering-intelligence-v0.2.0.zip.b64.part-* | base64 --decode > .release-cache/tikvaron-engineering-intelligence-v0.2.0.zip && unzip -t .release-cache/tikvaron-engineering-intelligence-v0.2.0.zip && unzip -q .release-cache/tikvaron-engineering-intelligence-v0.2.0.zip -d .tikvaron-release
      - name: Install package and development tools
        working-directory: ${{ env.TIKVARON_RELEASE_DIR }}
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Compile Python sources
        working-directory: ${{ env.TIKVARON_RELEASE_DIR }}
        run: python -m compileall -q src scripts tests
      - name: Run automated tests and export JUnit results
        working-directory: ${{ env.TIKVARON_RELEASE_DIR }}
        run: mkdir -p artifacts && pytest --junitxml=artifacts/junit.xml
      - name: Run static lint
        working-directory: ${{ env.TIKVARON_RELEASE_DIR }}
        run: ruff check .
      - name: Convert JUnit results to TIKVARON Test Intelligence
        if: ${{ always() && hashFiles('.tikvaron-release/tikvaron-engineering-intelligence/artifacts/junit.xml') != '' }}
        working-directory: ${{ env.TIKVARON_RELEASE_DIR }}
        run: tikvaron-tests artifacts/junit.xml --output artifacts/test-intelligence.json
      - name: Publish test intelligence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tikvaron-test-intelligence-${{ github.run_id }}
          path: .tikvaron-release/tikvaron-engineering-intelligence/artifacts/
          if-no-files-found: warn
          retention-days: 14
