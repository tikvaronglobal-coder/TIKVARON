name: TIKVARON Engineering Intelligence — PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# Analyze diffs through GitHub's API. Never check out or execute PR-head code.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tikvaron-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: TIKVARON AI + static security review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted base-branch workflow code only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore and integrity-check pinned v0.2.0 source release
        run: |
          mkdir -p .release-cache .tikvaron-release && cat releases/.archive-data/tikvaron-engineering-intelligence-v0.2.0.zip.b64.part-* | base64 --decode > .release-cache/tikvaron-engineering-intelligence-v0.2.0.zip && unzip -t .release-cache/tikvaron-engineering-intelligence-v0.2.0.zip && unzip -q .release-cache/tikvaron-engineering-intelligence-v0.2.0.zip -d .tikvaron-release
      - name: Install TIKVARON reviewer
        working-directory: .tikvaron-release/tikvaron-engineering-intelligence
        run: python -m pip install --upgrade pip && pip install .
      - name: Require configured OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY" || (echo 'Add OPENAI_API_KEY in repository Settings → Secrets and variables → Actions' && exit 1)
      - name: Review pull-request diff and publish advisory comment
        working-directory: .tikvaron-release/tikvaron-engineering-intelligence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TIKVARON_OPENAI_MODEL: ${{ vars.TIKVARON_OPENAI_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python -m tikvaron_engineering.github_action
