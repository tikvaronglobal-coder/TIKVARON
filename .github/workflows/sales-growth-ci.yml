name: TIKVARON Sales Growth CI

on:
  pull_request:
    paths:
      - "apps/sales-growth/**"
      - ".github/workflows/sales-growth-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/sales-growth/**"
      - ".github/workflows/sales-growth-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sales-growth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/sales-growth/package.json
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
