[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tikvaron-engineering-intelligence"
version = "0.1.0"
description = "TIKVARON multi-agent engineering intelligence and PR review engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=3.49.0,<4"]

[project.scripts]
tikvaron-review = "tikvaron_engineering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
