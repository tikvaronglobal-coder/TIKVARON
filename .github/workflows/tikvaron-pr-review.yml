name: TIKVARON Engineering Intelligence — PR Review

on:
  # A maintainer must explicitly apply the ai-review label to authorize a billable run.
  pull_request_target:
    types: [labeled]

# Analyze diffs through GitHub's API. Never check out or execute PR-head code.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tikvaron-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: TIKVARON AI + static security review
    if: github.event.label.name == 'ai-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted base-branch workflow code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Restore and integrity-check pinned v0.2.0 source release
        run: |
          mkdir -p .release-cache .tikvaron-release
          cat releases/.archive-data/tikvaron-engineering-intelligence-v0.2.0.zip.b64.part-* | base64 --decode > .release-cache/tikvaron-engineering-intelligence-v0.2.0.zip
          unzip -t .release-cache/tikvaron-engineering-intelligence-v0.2.0.zip
          unzip -q .release-cache/tikvaron-engineering-intelligence-v0.2.0.zip -d .tikvaron-release

      - name: Apply validated tracked release overlays
        run: python .github/scripts/apply_release_patches.py .tikvaron-release/tikvaron-engineering-intelligence

      - name: Install TIKVARON reviewer
        working-directory: .tikvaron-release/tikvaron-engineering-intelligence
        run: python -m pip install --upgrade pip && pip install .

      - name: Review pull-request diff and publish advisory comment
        working-directory: .tikvaron-release/tikvaron-engineering-intelligence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TIKVARON_OPENAI_MODEL: ${{ vars.TIKVARON_OPENAI_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning::OPENAI_API_KEY is not configured; TIKVARON AI review is safely skipped. Add the repository Actions secret to enable reviews."
            exit 0
          fi
          python -m tikvaron_engineering.github_action
