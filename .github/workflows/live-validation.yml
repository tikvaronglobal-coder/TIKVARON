name: TIKVARON Engineering Intelligence — Live Validation

on:
  workflow_dispatch:
    inputs:
      run_openai_smoke:
        description: Send one billable smoke-test request to the configured OpenAI Responses model
        required: true
        type: boolean
        default: false
      run_astra_smoke:
        description: Send one billable GPT-6 Astra Chat Completions request to verify authentication and inference
        required: true
        type: boolean
        default: false
      astra_model:
        description: OpenAI model ID to test (default is GPT-6 Astra)
        required: true
        type: string
        default: gpt-6-astra
      pr_numbers:
        description: Exactly three existing open PR numbers, comma-separated (for example 12,34,56)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  openai-smoke:
    if: ${{ inputs.run_openai_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Restore and integrity-check pinned v0.2.0 source release
        run: |
          mkdir -p .release-cache .tikvaron-release && cat releases/.archive-data/tikvaron-engineering-intelligence-v0.2.0.zip.b64.part-* | base64 --decode > .release-cache/tikvaron-engineering-intelligence-v0.2.0.zip && unzip -t .release-cache/tikvaron-engineering-intelligence-v0.2.0.zip && unzip -q .release-cache/tikvaron-engineering-intelligence-v0.2.0.zip -d .tikvaron-release
      - name: Apply validated tracked release overlays
        run: python .github/scripts/apply_release_patches.py .tikvaron-release/tikvaron-engineering-intelligence
      - name: Install package
        working-directory: .tikvaron-release/tikvaron-engineering-intelligence
        run: python -m pip install --upgrade pip && pip install .
      - name: Require configured API secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY" || (echo 'Add OPENAI_API_KEY in repository Settings → Secrets and variables → Actions' && exit 1)
      - name: Run live OpenAI Responses API smoke test
        working-directory: .tikvaron-release/tikvaron-engineering-intelligence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TIKVARON_OPENAI_MODEL: ${{ vars.TIKVARON_OPENAI_MODEL }}
        run: tikvaron-live-openai-smoke

  openai-astra-smoke:
    if: ${{ inputs.run_astra_smoke }}
    name: GPT-6 Astra authentication and inference
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the official OpenAI Python SDK
        run: python -m pip install --upgrade openai
      - name: Run one GPT-6 Astra Chat Completions authentication and inference request
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TIKVARON_ASTRA_MODEL: ${{ inputs.astra_model }}
          TIKVARON_REASONING_EFFORT: low
          TIKVARON_SMOKE_RESULT_PATH: ${{ runner.temp }}/gpt-6-astra-smoke.json
        run: |
          test -n "$OPENAI_API_KEY" || { echo 'Add OPENAI_API_KEY in repository Settings → Secrets and variables → Actions'; exit 1; }
          python .github/scripts/openai_astra_smoke.py
      - name: Upload GPT-6 Astra smoke-test result
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tikvaron-gpt-6-astra-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/gpt-6-astra-smoke.json
          if-no-files-found: warn
          retention-days: 14

  real-pr-pilot:
    if: ${{ inputs.pr_numbers != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Restore and integrity-check pinned v0.2.0 source release
        run: |
          mkdir -p .release-cache .tikvaron-release && cat releases/.archive-data/tikvaron-engineering-intelligence-v0.2.0.zip.b64.part-* | base64 --decode > .release-cache/tikvaron-engineering-intelligence-v0.2.0.zip && unzip -t .release-cache/tikvaron-engineering-intelligence-v0.2.0.zip && unzip -q .release-cache/tikvaron-engineering-intelligence-v0.2.0.zip -d .tikvaron-release
      - name: Apply validated tracked release overlays
        run: python .github/scripts/apply_release_patches.py .tikvaron-release/tikvaron-engineering-intelligence
      - name: Install package
        working-directory: .tikvaron-release/tikvaron-engineering-intelligence
        run: python -m pip install --upgrade pip && pip install .
      - name: Require configured API secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: test -n "$OPENAI_API_KEY" || (echo 'Add OPENAI_API_KEY in repository Settings → Secrets and variables → Actions' && exit 1)
      - name: Copy trusted repository-aware pilot runner
        run: cp .github/scripts/live_pr_validation.py .tikvaron-release/tikvaron-engineering-intelligence/scripts/live_pr_validation.py
      - name: Run read-only live review against three real PRs
        working-directory: .tikvaron-release/tikvaron-engineering-intelligence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TIKVARON_OPENAI_MODEL: ${{ vars.TIKVARON_ASTRA_MODEL || vars.TIKVARON_OPENAI_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          TIKVARON_VALIDATION_PR_NUMBERS: ${{ inputs.pr_numbers }}
        run: python scripts/live_pr_validation.py
      - name: Upload live PR validation record
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tikvaron-live-pr-validation-${{ github.run_id }}
          path: .tikvaron-release/tikvaron-engineering-intelligence/artifacts/live-pr-validation.json
          if-no-files-found: warn
          retention-days: 30
