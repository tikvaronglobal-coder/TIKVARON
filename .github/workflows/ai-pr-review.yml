name: TIKVARON AI Pull Request Review

on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tikvaron-ai-pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  ai-review:
    # Only a maintainer-applied label or an authorized manual dispatch can spend review tokens.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pin official actions to immutable release commits.
      - name: Check out trusted base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install TIKVARON review engine
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Fetch pull-request diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --color never > "$RUNNER_TEMP/pr.diff"
          diff_bytes=$(wc -c < "$RUNNER_TEMP/pr.diff")
          if (( diff_bytes == 0 )); then
            echo "::error::The pull-request diff is empty."
            exit 1
          fi
          if (( diff_bytes > 200000 )); then
            echo "::error::Diff is larger than the 200 KB review budget. Split the pull request or review selected commits."
            exit 1
          fi

      - name: Generate AI review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error::Add OPENAI_API_KEY under repository Settings > Secrets and variables > Actions."
            exit 1
          fi
          python -m tikvaron_engineering.cli \
            --diff "$RUNNER_TEMP/pr.diff" \
            --output "$RUNNER_TEMP/review.md"

      - name: Post review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr review "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --comment --body-file "$RUNNER_TEMP/review.md"
